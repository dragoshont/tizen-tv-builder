name: Toolkit host acceptance (Ubuntu + Windows)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dragoshont-samsung-tv-remote-toolkit]
permissions:
  contents: read
jobs:
  host-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Complete Python suite
        run: python -m unittest discover -s tests -v
      - name: Release classification of every tracked file
        run: python -c "import subprocess,sys;sys.path.insert(0,'tools');import release;print(len(release.payload_paths(subprocess.check_output(['git','ls-files'],text=True).split())),'release files classified')"
      - name: Real Windows loopback and private recording lifecycle
        if: always() && runner.os == 'Windows'
        run: python tests/windows_workbench_smoke.py
  generated-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Scaffold a second app (not Plex)
        run: python tools/tizen.py new "$RUNNER_TEMP/demo" --name "CI Demo"
      - name: App host tests
        working-directory: ${{ runner.temp }}/demo
        run: node --test tests/focus.test.js
      - name: Audit manifest, privileges, ES5 and credentials
        run: python tools/tizen.py audit "$RUNNER_TEMP/demo/app"
      - name: Deterministic unsigned package and package check
        run: |
          python tools/tizen.py pack "$RUNNER_TEMP/demo/app" --output "$RUNNER_TEMP/a.wgt"
          python tools/tizen.py pack "$RUNNER_TEMP/demo/app" --output "$RUNNER_TEMP/b.wgt"
          python tools/tizen.py check-package "$RUNNER_TEMP/a.wgt"
          python -c "import hashlib,sys;a,b=(hashlib.sha256(open(p,'rb').read()).hexdigest() for p in sys.argv[1:]);assert a==b,(a,b);print('deterministic',a)" "$RUNNER_TEMP/a.wgt" "$RUNNER_TEMP/b.wgt"
      - name: Unsigned package is refused where a signed one is required
        run: |
          if python tools/tizen.py check-package "$RUNNER_TEMP/a.wgt" --require-signed; then exit 1; fi
      - name: Planted credential fails the audit
        run: |
          echo 'var apiKey = "abcdefghijklmnop";' > "$RUNNER_TEMP/demo/app/js/leak.js"
          if python tools/tizen.py audit "$RUNNER_TEMP/demo/app"; then exit 1; fi
      - name: Budget harness
        run: |
          echo '{"coldStartMs":2000,"firstFrameMs":800,"firstHomeMs":3000}' > "$RUNNER_TEMP/m.json"
          python tools/tizen.py budgets --tier current --metrics "$RUNNER_TEMP/m.json"
