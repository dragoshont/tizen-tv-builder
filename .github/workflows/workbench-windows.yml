name: Workbench Windows host acceptance
on:
  workflow_dispatch:
  push:
    branches: [dragoshont-samsung-tv-remote-toolkit]
permissions:
  contents: read
jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Complete Python suite
        run: python -m unittest discover -s tests -v
      - name: Real Windows loopback and private recording lifecycle
        if: always()
        run: python tests/windows_workbench_smoke.py
